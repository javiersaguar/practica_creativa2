apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-runner
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-runner
subjects:
- kind: ServiceAccount
  name: airflow-sa
roleRef:
  kind: Role
  name: airflow-spark-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: airflow-init
        image: PRACTICA_REGISTRY/airflow:PRACTICA_TAG
        imagePullPolicy: Always
        command: ["bash", "-c", "airflow db migrate && (airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com 2>/dev/null || true)"]
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        - name: IN_K8S
          value: "true"
        - name: KUBECTL
          value: "/usr/local/bin/kubectl"
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags/retrain_model.py
          subPath: retrain_model.py
      containers:
      - name: airflow
        image: PRACTICA_REGISTRY/airflow:PRACTICA_TAG
        imagePullPolicy: Always
        command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver.pid && airflow webserver --workers 1 & exec airflow scheduler"]
        ports:
        - containerPort: 8080
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: "false"
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: "sqlite:////opt/airflow/airflow.db"
        - name: IN_K8S
          value: "true"
        - name: KUBECTL
          value: "/usr/local/bin/kubectl"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: airflow-db
          mountPath: /opt/airflow
        - name: dags
          mountPath: /opt/airflow/dags/retrain_model.py
          subPath: retrain_model.py
      serviceAccountName: airflow-sa
      volumes:
      - name: airflow-db
        emptyDir: {}
      - name: dags
        configMap:
          name: airflow-dags
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  type: NodePort
  selector:
    app: airflow
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30808

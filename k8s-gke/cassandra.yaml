apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      tolerations:
      - key: "node.kubernetes.io/memory-pressure"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: cassandra
        image: cassandra:4.1.11
        ports:
        - containerPort: 9042
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: "practica"
        - name: MAX_HEAP_SIZE
          value: "768M"
        - name: HEAP_NEWSIZE
          value: "192M"
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1536Mi"
        readinessProbe:
          exec:
            command: ["cqlsh", "-e", "describe keyspaces"]
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
spec:
  publishNotReadyAddresses: true
  selector:
    app: cassandra
  ports:
  - port: 9042
    targetPort: 9042

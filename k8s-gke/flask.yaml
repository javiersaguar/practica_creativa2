apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: PRACTICA_REGISTRY/flask:PRACTICA_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 5001
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: MONGO_URI
          value: "mongodb://mongo:27017"
        - name: CASSANDRA_HOST
          value: "cassandra"
---
apiVersion: v1
kind: Service
metadata:
  name: flask
spec:
  type: NodePort
  selector:
    app: flask
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30001

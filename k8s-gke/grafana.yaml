apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:13.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboard-flight
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-provisioning
        configMap:
          name: grafana-dashboards-provisioning
      - name: grafana-dashboard-flight
        configMap:
          name: grafana-dashboard-flight
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30300
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      access: proxy
      isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: default
      folder: ''
      type: file
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-flight
data:
  flight_pipeline.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "flight_requests_total",
              "legendFormat": "requests",
              "refId": "A"
            }
          ],
          "title": "Solicitudes enviadas a Kafka (total)",
          "type": "stat"
        },
        {
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "sum(flight_predictions_total)",
              "legendFormat": "predicciones",
              "refId": "A"
            }
          ],
          "title": "Predicciones recibidas (total)",
          "type": "stat"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "targets": [
            {
              "expr": "flight_predictions_total",
              "legendFormat": "{{category}}",
              "refId": "A"
            }
          ],
          "title": "Predicciones por categor\u00eda",
          "type": "piechart"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "id": 3,
          "targets": [
            {
              "expr": "rate(flight_requests_total[1m])",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ],
          "title": "Tasa de solicitudes (req/s)",
          "type": "timeseries"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 6,
          "targets": [
            {
              "expr": "rate(flask_http_request_total[1m])",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "title": "HTTP requests por ruta",
          "type": "timeseries"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "id": 5,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(flask_http_request_duration_seconds_bucket[5m]))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "Latencia HTTP Flask (p95)",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": [],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Flight Delay Pipeline",
      "uid": "adtdmz5",
      "version": 1,
      "weekStart": ""
    }
